<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>老岳AI产品论坛 | 需求与原型实践笔记</title>
<style>
/* ======================================================================
   老岳AI产品论坛 · PC 网页原型（首期口径 2026-11-09）
   站内全自产：深度长文（作者署名）+ 提示词库 + AI 工具库 + 资料库（模板/方法术语/案例，编辑部署名）+ 问答
   不做积分 / 读者不登录 / 只有作者登录 / 文末作者微信赞赏码 / 订阅更新 / 私下提问
   ====================================================================== */
:root{--y:#FFD84D;--y2:#FFF4C2;--y3:#FFFAE3;--ink:#161616;--ink2:#2A2A28;--bg:#F4F4F1;--card:#fff;--line:#E6E6E1;--line2:#EFEFEB;
  --mute:#696963;--deco:#B9B9B2;--ok:#0E7350;--okbg:#E7F5EE;--q:#2F5FD0;--qbg:#EAF1FF;--r:16px;
  --ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1);--hd:64px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:calc(var(--hd) + 20px)}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;cursor:pointer}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.num{font-family:"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sr:focus{position:fixed;left:12px;top:12px;width:auto;height:auto;clip:auto;z-index:99;background:#fff;padding:8px 12px;border-radius:8px}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;background:rgba(244,244,241,.84);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid rgba(22,22,22,.06)}
.hdr{height:var(--hd);display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.brand img{width:32px;height:32px;border-radius:10px;background:var(--y);object-fit:cover}
.nav{display:flex;gap:2px;flex:none}
.nav a{white-space:nowrap;padding:7px 11px;font-size:14.5px;color:var(--ink2);position:relative;border-radius:8px;transition:background .2s var(--ease)}
.nav a:hover{background:rgba(22,22,22,.05)}
.nav a.on{font-weight:700}
.nav a.on:after{content:"";position:absolute;left:11px;right:11px;bottom:-12px;height:2px;border-radius:2px;background:var(--ink)}
.sch{margin-left:auto;display:flex;align-items:center;gap:8px;height:38px;flex:0 1 240px;min-width:140px;padding:0 10px 0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mute);font-size:13.5px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.sch:focus-within{border-color:var(--ink);box-shadow:0 0 0 4px rgba(22,22,22,.06)}
.sch input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--ink)}
.kbd{font-family:Menlo,monospace;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--mute)}
.usr{display:flex;align-items:center;gap:6px}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid var(--ink);background:var(--ink);color:#fff;white-space:nowrap;transition:transform .18s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease),color .2s;user-select:none}
.btn:hover{box-shadow:0 6px 16px -8px rgba(22,22,22,.45)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.y{background:var(--y);border-color:var(--y);color:var(--ink)}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink);box-shadow:none}
.btn.quiet{background:none;border-color:transparent;color:var(--ink2)}
.btn.quiet:hover{background:rgba(22,22,22,.05);box-shadow:none}
.btn.sm{height:32px;padding:0 13px;font-size:13px}
.btn.lg{height:52px;padding:0 8px 0 24px;font-size:15.5px}
.btn .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(22,22,22,.08);transition:transform .35s var(--ease)}
.btn.lg:not(.y):not(.done) .ico{background:rgba(255,255,255,.15)}
.btn:hover .ico{transform:translateY(1px) scale(1.06)}
.btn.done{background:var(--okbg);border-color:var(--okbg);color:var(--ok)}
.btn.done .ico{background:rgba(14,115,80,.12)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- atoms ---------- */
.av{width:32px;height:32px;border-radius:50%;flex:none;display:inline-grid;place-items:center;color:#fff;font-size:13px;font-weight:700;object-fit:cover;background:var(--y)}
.av.s{width:22px;height:22px;font-size:10px}.av.l{width:52px;height:52px;font-size:20px}.av.xl{width:84px;height:84px;font-size:30px}
.av.ed{background:var(--ink)!important;color:var(--y)}
.anon{width:32px;height:32px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute);background:repeating-linear-gradient(135deg,#EFEFEA 0 4px,#F7F7F3 4px 8px);border:1px dashed #CFCFC8}
.anon.s{width:22px;height:22px;font-size:10px}
.off{display:inline-flex;height:17px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:700;background:var(--y);color:var(--ink);align-items:center;vertical-align:1px}
.tagq{display:inline-block;white-space:nowrap;line-height:20px;font-size:11.5px;vertical-align:2px;margin-right:6px;padding:0 7px;border-radius:5px;font-weight:700}
.tagq.q{background:var(--qbg);color:var(--q)}.tagq.r{background:var(--y2);color:#7A5B00}.tagq.p{background:var(--ink);color:var(--y)}.tagq.pin{background:#FFE8E3;color:#B23A0B}.tagq.f{background:var(--y);color:var(--ink)}.tagq.l{background:#EDEDE8;color:var(--ink2)}
.kd{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.kd:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.kd-prompt{background:#FFF1D6;color:#8A5300}.kd-template{background:#E9F3FF;color:#1D5BB8}.kd-term{background:#F1ECFF;color:#5B3CC4}.kd-case{background:#E7F5EE;color:#0E7350}.kd-article{background:var(--ink);color:var(--y)}.kd-tool{background:#EDEDE8;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;background:#EFEFEA;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.bezel{padding:6px;border-radius:24px;background:rgba(22,22,22,.035);box-shadow:inset 0 0 0 1px rgba(22,22,22,.06)}
.bezel>.core{border-radius:18px;background:#fff;box-shadow:0 10px 30px -18px rgba(22,22,22,.25)}
/* ---------- layout ---------- */
.grid3{display:grid;grid-template-columns:188px minmax(0,1fr) 300px;gap:28px;padding:28px 0 96px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding:28px 0 96px}
.gridL{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding:28px 0 96px}
.side{position:sticky;top:calc(var(--hd) + 24px);align-self:start}
.side .lbl{font-size:12px;color:var(--mute);padding:16px 12px 6px;letter-spacing:1px}
.side a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;font-size:14.5px;color:var(--ink2);transition:background .2s var(--ease)}
.side a i{font-style:normal;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;background:#E9E9E4}
.side a small{margin-left:auto;font-size:11.5px;color:var(--mute);font-family:Menlo,monospace}
.side a:hover{background:rgba(22,22,22,.05)}
.side a.on{background:var(--card);font-weight:700;box-shadow:0 0 0 1px var(--line),0 4px 12px -8px rgba(22,22,22,.2)}
.side a.on i{background:var(--y)}
.sec{display:flex;align-items:baseline;gap:12px;margin:36px 0 14px}
.sec h2{font-size:20px;letter-spacing:-.3px}
.sec small{font-size:13px;color:var(--mute)}
.sec .more{margin-left:auto;font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:4px;font-weight:600}
.sec .more:hover{text-decoration:underline;text-underline-offset:3px}
/* hero picks */
.picks{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.pick{position:relative;overflow:hidden;border-radius:var(--r);background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:26px;min-height:300px}
.pick img{position:absolute;right:-30px;top:18px;width:58%;border-radius:10px;transform:rotate(4deg);box-shadow:0 20px 40px -10px rgba(0,0,0,.6);transition:transform .8s var(--ease)}
.pick:hover img{transform:rotate(2deg) translateY(-4px)}
.pick:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 40%,rgba(22,22,22,.5) 72%,rgba(22,22,22,.1));z-index:1}
.pick>*:not(img){position:relative;z-index:2;max-width:64%}
.eyebrow{display:inline-flex;align-self:flex-start;background:var(--y);color:var(--ink);font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;margin-bottom:12px;letter-spacing:.5px}
.pick h2{font-size:25px;line-height:1.35;letter-spacing:-.3px}
.pick p{font-size:13px;color:#BDBDB6;margin-top:10px}
.pick-col{display:grid;gap:14px}
.pick.s{min-height:143px;padding:18px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.pick.s:before{display:none}
.pick.s img{width:40%;right:-14px;top:14px;box-shadow:0 10px 24px -8px rgba(22,22,22,.25)}
.pick.s>*:not(img){max-width:60%}
.pick.s h2{font-size:16px;letter-spacing:0}
.pick.s .eyebrow{background:var(--ink);color:var(--y)}
/* 规模条 */
.scale{margin-top:16px}
.scale .core{display:grid;grid-template-columns:1.3fr repeat(5,1fr);align-items:stretch}
.scale a{padding:18px 18px 16px;border-left:1px solid var(--line2);transition:background .2s var(--ease)}
.scale a:first-child{border-left:0;background:var(--ink);color:#fff;border-radius:18px 0 0 18px}
.scale a:not(:first-child):hover{background:#FBFBF9}
.scale small{display:block;font-size:12px;color:var(--mute)}
.scale a:first-child small{color:#B5B5AE}
.scale b{display:block;font-family:"SF Mono",Menlo,monospace;font-size:24px;letter-spacing:-.5px;line-height:1.25;margin-top:2px}
.scale a:first-child b{font-size:30px;color:var(--y)}
.scale em{font-style:normal;font-size:11px;color:var(--mute)}
.scale a:first-child em{color:#8F8F88}
/* feed */
.tabs{display:flex;align-items:center;gap:4px;padding:6px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.tabs a{padding:6px 13px;border-radius:999px;font-size:14px;color:var(--mute);transition:background .2s var(--ease),color .2s}
.tabs a:hover{color:var(--ink)}
.tabs a.on{background:var(--ink);color:#fff;font-weight:600}
.tabs .r{margin-left:auto;font-size:12.5px;color:var(--mute);padding-right:8px}
.item{display:flex;gap:20px;padding:20px 22px;border-bottom:1px solid var(--line2);transition:background .2s var(--ease)}
.item:last-child{border-bottom:0}
.item:hover{background:#FBFBF9}
.item:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.item .main{flex:1;min-width:0}
.item h3{font-size:17px;line-height:1.45;font-weight:700}
.item p{font-size:13.5px;color:var(--mute);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .thumb{width:168px;height:112px;flex:none;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line2)}
.item .thumb img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .6s var(--ease)}
.item:hover .thumb img{transform:scale(1.03)}
.meta{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.meta .who{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.meta .dot{width:3px;height:3px;border-radius:50%;background:var(--deco)}
.meta .sp{margin-left:auto;display:flex;gap:14px}
.stack{display:flex}.stack .av{margin-left:-6px;border:2px solid #fff}.stack .av:first-child{margin-left:0}
.attach-mini{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok);background:var(--okbg);border-radius:6px;padding:1px 8px;font-weight:600}
.asker{display:inline-flex;align-items:center;gap:6px;color:var(--mute)}
.asker b{font-weight:600;color:var(--ink2)}
/* 卡片网格（资料库） */
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cc{display:flex;flex-direction:column;padding:18px 18px 16px;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .2s}
.cc:hover{transform:translateY(-2px);box-shadow:0 16px 30px -22px rgba(22,22,22,.45);border-color:#D6D6D0}
.cc h3{font-size:15.5px;line-height:1.5;margin-top:10px}
.cc p{font-size:13px;color:var(--mute);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc .ft{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.cc .ft .r{margin-left:auto}
/* 提示词卡（变量就地填写） */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.pc{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.pc .hd{display:flex;align-items:flex-start;gap:12px}
.pc h3{font-size:16px;line-height:1.5;flex:1;min-width:0}
.pc h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.pc .sc{display:flex;gap:6px;flex-wrap:wrap}
.pt{font-size:14px;line-height:1.95;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.var{display:inline;padding:2px 7px;margin:0 1px;border-radius:6px;background:var(--y2);color:#6B4E00;font-weight:600;border:1px dashed #E5C24A;cursor:text;transition:background .2s,border-color .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.var:hover{background:var(--y);border-style:solid}
.var.filled{background:var(--okbg);color:var(--ok);border:1px solid #BFE3D2}
.var.miss{animation:nudge .5s var(--ease);border-color:#D9480F;border-style:solid}
@keyframes nudge{30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
.vin{font:inherit;font-weight:600;font-size:14px;padding:1px 8px;border-radius:6px;border:1.5px solid var(--ink);outline:0;background:#fff;color:var(--ink);min-width:6em;max-width:100%;box-shadow:0 0 0 4px rgba(255,216,77,.45)}
textarea.vin{display:block;width:100%;min-height:72px;margin:4px 0;line-height:1.6;resize:vertical}
.pfoot{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--mute)}
.pfoot .fc{font-family:Menlo,monospace}
.pfoot .btn{margin-left:auto}
.hint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:#FFF6E8;border:1px solid #F5DDB0;font-size:13px;color:#6B4E00;animation:rise .3s var(--ease)}
.hint .btn{height:30px}
/* 场景胶囊（多选） */
.caps{display:flex;gap:8px;flex-wrap:wrap}
.cap{height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;transition:background .2s,border-color .2s,color .2s,transform .18s var(--ease)}
.cap:hover{border-color:var(--ink)}
.cap:active{transform:scale(.96)}
.cap.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cap.on:before{content:"✓";font-weight:800;color:var(--y)}
.cap small{font-family:Menlo,monospace;font-size:11px;color:var(--mute)}
.cap.on small{color:#B5B5AE}
.filterbar{padding:18px 20px;display:grid;gap:14px;margin-bottom:16px}
.frow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.frow>label{font-size:12.5px;color:var(--mute);width:40px;flex:none}
.fsel{display:inline-flex;background:#EDEDE8;border-radius:999px;padding:3px}
.fsel a{padding:4px 12px;border-radius:999px;font-size:13px;color:var(--mute);white-space:nowrap}
.fsel a.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(22,22,22,.08)}
.fsearch{display:flex;align-items:center;gap:8px;height:40px;flex:1;min-width:220px;max-width:360px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#FBFBF9}
.fsearch:focus-within{border-color:var(--ink);background:#fff}
.fsearch input{flex:1;border:0;outline:0;background:none;font-size:14px}
.result{display:flex;align-items:baseline;gap:10px;margin:0 2px 12px;font-size:13px;color:var(--mute)}
.result b{font-family:Menlo,monospace;color:var(--ink);font-size:15px}
.result a{text-decoration:underline}
/* 分页 */
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:22px;font-size:13.5px}
.pager a,.pager span{min-width:38px;height:38px;padding:0 10px;border-radius:999px;display:inline-grid;place-items:center;border:1px solid transparent}
.pager a{background:#fff;border-color:var(--line);font-family:Menlo,monospace}
.pager a:hover{border-color:var(--ink)}
.pager a.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pager a.tx{font-family:inherit}
.pager .gap{color:var(--mute)}
.pager .jump{display:inline-flex;align-items:center;gap:6px;margin-left:10px;color:var(--mute);font-size:13px}
.pager .jump input{width:56px;height:34px;border-radius:999px;border:1px solid var(--line);text-align:center;font-family:Menlo,monospace}
/* 工具库 */
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tl{display:flex;align-items:center;gap:12px;padding:14px;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .2s}
.tl:hover{transform:translateY(-2px);box-shadow:0 14px 26px -20px rgba(22,22,22,.5);border-color:#D6D6D0}
.tl .lg{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.tl div{min-width:0}
.tl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcat{margin-bottom:30px}
.tcat .sec{margin-top:0}
.tcat .sec h2{font-size:17px;display:flex;align-items:center;gap:8px}
.tcat .sec h2 i{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--y);display:grid;place-items:center;font-size:13px}
.thead{padding:28px 30px;display:flex;gap:20px;align-items:flex-start}
.thead .lg{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:30px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.thead h1{font-size:26px;letter-spacing:-.3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.thead p{font-size:15px;color:var(--ink2);margin-top:4px}
.thead .facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tsec{padding:22px 30px;border-top:1px solid var(--line2)}
.tsec h3{font-size:15px;margin-bottom:10px}
.steps3{list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.steps3 li{counter-increment:s;padding:14px;border-radius:12px;background:#FBFBF9;border:1px solid var(--line2);font-size:14px;line-height:1.7}
.steps3 li:before{content:counter(s);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--y);font-family:Menlo,monospace;font-weight:800;font-size:12px;margin-bottom:8px}
.fitg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fitg div{padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.75}
.fitg .yes{background:var(--okbg)}.fitg .no{background:#FBEFEA}
.fitg b{display:block;font-size:12.5px;margin-bottom:4px}
.fitg .yes b{color:var(--ok)}.fitg .no b{color:#B23A0B}
/* skeleton */
.sk{background:linear-gradient(90deg,#ECECE7 0,#F6F6F2 40%,#ECECE7 80%) 0 0/200% 100%;border-radius:8px;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
/* rail */
.rail{display:grid;gap:16px;align-self:start}
.box{padding:20px}
.box h4{font-size:15px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.box h4 a{font-size:12.5px;font-weight:400;color:var(--mute)}
.rank li{list-style:none;display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px;line-height:1.5}
.rank li:last-child{border:0}
.rank li a:hover{text-decoration:underline;text-underline-offset:3px}
.rank em{font-style:normal;font-family:Menlo,monospace;font-weight:700;color:var(--mute);width:16px;flex:none}
.rank li:nth-child(-n+3) em{color:var(--ink)}
.people .p{display:flex;align-items:center;gap:10px;padding:7px 0;border-radius:10px}
.people .p:hover b{text-decoration:underline}
.people .p div{flex:1;min-width:0;font-size:13.5px}
.people .p small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subbox{background:var(--ink);color:#fff;border:0;padding:22px;position:relative;overflow:hidden}
.subbox:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,216,77,.22),transparent 70%)}
.subbox h4{font-size:17px;margin-bottom:4px;color:#fff;position:relative;z-index:1}
.subbox p{font-size:12.5px;color:#B5B5AE;position:relative;z-index:1}
.subform{display:flex;gap:6px;margin-top:14px;position:relative;z-index:1;padding:4px;border-radius:999px;background:#262623;border:1px solid #33332F}
.subform:focus-within{border-color:var(--y)}
.subform input{flex:1;min-width:0;border:0;outline:0;background:none;color:#fff;padding:0 12px;font-size:13.5px}
.subform input::placeholder{color:#8F8F88}
.subform .btn{height:34px}
.subok{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:#E6E6E0;position:relative;z-index:1}
.subok i{width:22px;height:22px;border-radius:50%;background:var(--y);color:var(--ink);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px}
.subok a{margin-left:auto;color:#B5B5AE;font-size:12px;text-decoration:underline}
/* boards / heads */
.bhead{padding:24px;margin-bottom:16px;display:flex;align-items:center;gap:16px}
.bhead>i{font-style:normal;width:52px;height:52px;border-radius:14px;background:var(--y);display:grid;place-items:center;font-size:22px;flex:none}
.bhead h1{font-size:24px;letter-spacing:-.3px}.bhead p{font-size:13.5px;color:var(--mute)}
.bhead .st{margin-left:auto;display:flex;gap:24px;text-align:right;font-size:12px;color:var(--mute)}.bhead .st b{display:block;font-size:20px;color:var(--ink);font-family:Menlo,monospace}
.qa-head{flex-wrap:wrap;row-gap:12px}
.qa-head .ctl{margin-left:auto;text-align:right;flex:none}
.qa-head .ctl small{display:block;font-size:12px;color:var(--mute);margin-top:6px}
.flow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);flex-basis:100%;padding-left:68px}
.flow span{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 5px;border-radius:999px;background:#F2F2EE;white-space:nowrap}
.flow span i{font-style:normal;font-family:Menlo,monospace;font-weight:700;font-size:11px;width:17px;height:17px;border-radius:50%;background:var(--ink);color:var(--y);display:grid;place-items:center}
.flow em{font-style:normal;color:var(--deco)}
/* ---------- 详情 ---------- */
.progress{position:fixed;left:0;right:0;top:var(--hd);height:2px;z-index:31;pointer-events:none}
.progress i{display:block;height:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
.art{padding:40px 48px 36px}
.crumb{font-size:13px;color:var(--mute);margin-bottom:14px}
.crumb a:hover{color:var(--ink);text-decoration:underline}
.art h1{font-size:31px;line-height:1.36;letter-spacing:-.4px}
.byline{display:flex;align-items:center;gap:12px;margin:20px 0 28px;padding-bottom:22px;border-bottom:1px solid var(--line2)}
.byline .n{font-weight:700;display:flex;align-items:center;gap:6px}.byline small{display:block;font-size:12.5px;color:var(--mute)}
.byline .tm{margin-left:auto;font-size:12.5px;color:var(--mute);text-align:right}
.prose{font-size:16.5px;line-height:1.92;color:#262624}
.prose h2{font-size:20px;margin:34px 0 10px;letter-spacing:-.2px}
.prose p{margin:12px 0}
.prose img{width:100%;border-radius:12px;border:1px solid var(--line);margin:16px 0}
.prose blockquote{border-left:3px solid var(--y);background:#FBFBF7;padding:12px 16px;border-radius:0 10px 10px 0;margin:16px 0;font-size:15px;color:var(--ink2)}
.prose ul{padding-left:20px}
.pbox{border-radius:14px;background:#FBFBF7;border:1px solid var(--line);margin:16px 0;overflow:hidden}
.pbox .ph{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--mute);letter-spacing:.3px}
.pbox .pt{padding:14px 18px 16px;font-size:15px}
/* 卡片详情：一屏讲完 */
.cd{padding:34px 40px 30px}
.cd h1{font-size:26px;line-height:1.4;letter-spacing:-.3px;margin:12px 0 6px}
.cd .sum{font-size:15.5px;color:var(--ink2);line-height:1.8}
.fitline{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;padding:12px 14px;border-radius:12px;background:var(--y3);border:1px solid #F3E3A6;font-size:14px;line-height:1.7}
.fitline b{flex:none;font-size:12px;height:22px;padding:0 8px;border-radius:6px;background:var(--ink);color:var(--y);display:inline-flex;align-items:center;margin-top:1px}
.cd .main{margin-top:20px}
.cd .bigact{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line2)}
.cd .bigact small{font-size:12.5px;color:var(--mute)}
.signed{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.colsig{display:inline-flex;align-items:center;gap:8px;flex:none}
.colsig span{display:flex;flex-direction:column;line-height:1.25;text-align:left}.colsig b{font-size:13px;color:var(--ink);white-space:nowrap}.colsig em{font-style:normal;font-size:11px;color:var(--mute);white-space:nowrap}
.colsig:hover b{text-decoration:underline}
.defbox{padding:18px 20px;border-radius:14px;background:#F7F5FF;border:1px solid #E4DCFF;font-size:16px;line-height:1.85}
.defbox+.defbox{margin-top:10px;background:#FBFBF9;border-color:var(--line2);font-size:14.5px}
.defbox b{display:block;font-size:12px;color:#5B3CC4;margin-bottom:4px;letter-spacing:.5px}
.defbox+.defbox b{color:var(--mute)}
.pts{list-style:none;display:grid;gap:8px}
.pts li{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:#FBFBF9;border:1px solid var(--line2);font-size:15px;line-height:1.7}
.pts li:before{content:counter(list-item);flex:none;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-family:Menlo,monospace;font-weight:800;font-size:12px;display:grid;place-items:center;margin-top:2px}
.rwline{display:flex;align-items:center;gap:12px;padding:14px 18px;font-size:13.5px;color:var(--ink2)}
.rwline small{color:var(--mute)}
.rwline .btn{margin-left:auto}
/* 下载卡 */
.dlc{margin:26px 0 8px}
.dlc .core{display:flex;align-items:center;gap:16px;padding:18px 18px 18px 20px}
.dlc .ft{width:48px;height:56px;border-radius:9px;background:var(--ink);color:var(--y);display:grid;place-items:center;font-size:11px;font-weight:700;font-family:Menlo,monospace;flex:none}
.dlc .core>div{flex:1;min-width:0}.dlc b{display:block;font-size:15px}.dlc small{font-size:12.5px;color:var(--mute)}
.dlc .free{color:var(--ok);font-weight:700}
.inc{list-style:none;margin-top:10px}
.inc li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2);font-size:13.5px}
.inc code{font-family:Menlo,monospace;font-size:12px;background:#F2F2EE;border-radius:5px;padding:1px 6px}
/* 互动 */
.acts{display:flex;justify-content:center;gap:12px;margin:36px 0 4px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;width:92px;padding:11px 0 9px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--mute);transition:transform .18s var(--ease),border-color .2s,background .2s}
.act:hover{border-color:var(--ink)}
.act:active{transform:scale(.95)}
.act b{font-size:19px;color:var(--ink);line-height:1.3;font-weight:400;display:block}
.act.on{background:var(--y);border-color:var(--y);color:var(--ink)}
.act.pop b,.pop{animation:pop .45s var(--spring)}
@keyframes pop{40%{transform:scale(1.4)}}
.endzone{margin-top:16px;display:grid;gap:16px}
.addn{padding:28px 48px 30px}
.addn .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.addn h3{font-size:17px}
.addn .hd small{font-size:12.5px;color:var(--mute)}
.adi{display:grid;grid-template-columns:60px minmax(0,1fr);gap:0 18px;padding:18px 0;border-top:1px solid var(--line2)}
.adi time{font-family:Menlo,monospace;font-size:12px;color:var(--mute);padding-top:3px}
.adi .q{font-size:13.5px;color:var(--mute);padding-left:10px;border-left:3px solid var(--line)}
.adi .a{font-size:15px;line-height:1.85;margin-top:8px;color:var(--ink2)}
.adi .a b{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;background:var(--ink);color:var(--y);font-size:11px;margin-right:8px;vertical-align:2px}
/* 赞赏 */
.reward .core{display:grid;grid-template-columns:minmax(0,1fr) 196px;gap:28px;align-items:center;padding:28px 28px 28px 32px;background:linear-gradient(120deg,#fff 40%,var(--y3))}
.reward .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.reward h3{font-size:22px;letter-spacing:-.3px;margin:14px 0 6px;line-height:1.35}
.reward p{font-size:13.5px;color:var(--mute);line-height:1.75}
.reward .how{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:12.5px;color:var(--ink2)}
.reward .how .m{display:none}
.zsm{width:196px;padding:12px 12px 10px;border-radius:16px;background:#fff;border:1px solid var(--line);text-align:center;box-shadow:0 18px 36px -20px rgba(22,22,22,.35)}
.zsm .qr{width:172px;height:172px;border-radius:10px;position:relative;background:linear-gradient(#fff,#fff) 50% 50%/46px 46px no-repeat,conic-gradient(from 90deg at 2px 2px,#fff 25%,transparent 0) 0 0/8px 8px,repeating-linear-gradient(90deg,#1b1b1b 0 4px,#fff 4px 7px,#1b1b1b 7px 9px,#fff 9px 14px),#fff}
.zsm .qr i{position:absolute;width:34px;height:34px;border:6px solid #1b1b1b;border-radius:6px;background:radial-gradient(#1b1b1b 40%,#fff 42%)}
.zsm .qr i:nth-child(1){left:6px;top:6px}.zsm .qr i:nth-child(2){right:6px;top:6px}.zsm .qr i:nth-child(3){left:6px;bottom:6px}
.zsm .qr img{position:absolute;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.zsm .lab{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:12px;font-weight:700;color:var(--ink)}
.zsm .lab i{width:16px;height:16px;border-radius:5px;background:#F2B705;display:grid;place-items:center;font-style:normal;color:#fff;font-size:10px}
.zsm small{display:block;font-size:10.5px;color:var(--mute);margin-top:2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini{padding:22px 24px}
.mini h4{font-size:15.5px;display:flex;align-items:center;gap:8px}
.mini p{font-size:13px;color:var(--mute);margin:4px 0 14px}
.inl{display:flex;gap:6px;padding:4px;border:1px solid var(--line);border-radius:999px;background:#FBFBF9;transition:border-color .2s,box-shadow .2s}
.inl:focus-within{border-color:var(--ink);box-shadow:0 0 0 4px rgba(22,22,22,.06)}
.inl input{flex:1;min-width:0;border:0;outline:0;background:none;padding:0 12px;font-size:14px}
.related h4{font-size:15px;padding:16px 24px 6px}
.rel{display:grid;grid-template-columns:repeat(3,1fr)}
.rel a{padding:14px 24px 20px;display:block;border-right:1px solid var(--line2)}
.rel a:last-child{border-right:0}
.rel small{font-size:12px;color:var(--mute)}
.rel b{display:block;font-size:14.5px;line-height:1.5;margin-top:4px}
.rel a:hover b{text-decoration:underline;text-underline-offset:3px}
.toc{padding:18px 20px}
.toc h4{font-size:13px;color:var(--mute);font-weight:600;letter-spacing:1px;margin-bottom:8px}
.toc a{display:block;padding:6px 0 6px 12px;font-size:13.5px;color:var(--mute);border-left:2px solid var(--line2);transition:color .2s,border-color .2s}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--ink);font-weight:600;border-left-color:var(--ink)}
.sticky{position:sticky;top:calc(var(--hd) + 24px)}
/* 问答 */
.q-head{padding:32px 36px}
.q-head h1{font-size:26px;line-height:1.4;margin:10px 0}
.ans{padding:24px 30px;border-top:1px solid var(--line2)}
.ans .ah{display:flex;align-items:center;gap:10px}
.ans .by{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--ink);color:var(--y);margin-left:auto}
.ans .ops{display:flex;align-items:center;gap:8px;margin-top:12px}
.ansnote{padding:16px 30px;border-top:1px solid var(--line2);font-size:13px;color:var(--mute);display:flex;align-items:center;gap:10px;background:#FBFBF9;border-radius:0 0 var(--r) var(--r)}
.ansnote a{text-decoration:underline;color:var(--ink)}
/* 我的 / 作者后台 */
.prof{padding:28px 32px;display:flex;align-items:center;gap:22px;margin-bottom:16px}
.prof h1{font-size:24px;display:flex;align-items:center;gap:8px}.prof p{color:var(--mute);font-size:13.5px;max-width:560px}
.prof .st{margin-left:auto;display:flex;gap:30px;text-align:center;font-size:12px;color:var(--mute)}
.prof .st b{display:block;font-family:Menlo,monospace;font-size:22px;color:var(--ink)}
.local{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--ink2);background:#F2F2EE;border-radius:999px;padding:4px 12px 4px 6px;width:max-content;max-width:100%}
.local i{width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--y);display:grid;place-items:center;font-style:normal;font-size:10px}
.letter{display:flex;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line2)}
.letter:last-child{border-bottom:0}
.letter .main{flex:1;min-width:0}
.letter h3{font-size:16px;line-height:1.5}
.letter p{font-size:13.5px;color:var(--mute);margin-top:4px}
.letter .ops{display:flex;flex-direction:column;gap:8px;flex:none;align-items:stretch}
.st-chip{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.st-new{background:var(--y2);color:#7A5B00}.st-ok{background:var(--okbg);color:var(--ok)}.st-wait{background:#EDEDE8;color:var(--mute)}
.banner{padding:12px 22px;border-bottom:1px solid var(--line2);font-size:13px;color:var(--ink2);background:#FBFBF9}
.empty{padding:56px 20px;text-align:center;color:var(--mute);font-size:14px}
.empty .ei{width:52px;height:52px;border-radius:16px;background:#F0F0EB;display:grid;place-items:center;margin:0 auto 12px;font-size:20px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .acts2{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.write{padding:32px 36px}
.seg{display:inline-flex;background:#EDEDE8;border-radius:999px;padding:3px}
.seg a{padding:6px 16px;border-radius:999px;font-size:14px;color:var(--mute);white-space:nowrap}
.seg a.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(22,22,22,.08)}
.fld{margin-bottom:18px}.fld label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px}
.fld label small{font-weight:400;color:var(--mute);margin-left:4px}
.inp{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:15px;outline:0;background:#FBFBF9;transition:border-color .2s,box-shadow .2s,background .2s}
.inp:focus{border-color:var(--ink);background:#fff;box-shadow:0 0 0 4px rgba(22,22,22,.06)}
.inp.title{height:56px;font-size:20px;font-weight:700}
textarea.inp{height:220px;padding:12px 14px;resize:vertical;line-height:1.8}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;transition:background .2s,border-color .2s,color .2s}
.opt:hover{border-color:var(--ink)}
.opt.on{border-color:var(--ink);background:var(--ink);color:#fff}
.opt .av{width:20px;height:20px;font-size:9px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--mute);font-size:13.5px;background:#FBFBF9}
.foot{display:flex;align-items:center;gap:12px;padding-top:18px;border-top:1px solid var(--line2);margin-top:6px}
.foot small{color:var(--mute);font-size:12.5px}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink2);cursor:pointer}
.check input{margin-top:4px;accent-color:var(--ink);width:15px;height:15px}
.quote{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#FBFBF9;font-size:14px;margin-bottom:18px}
.quote small{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.rwset{display:grid;grid-template-columns:1fr 220px;gap:24px;align-items:start}
.tick li{list-style:none;display:flex;gap:8px;font-size:13px;color:var(--ink2);padding:4px 0}
.tick li:before{content:"✓";color:var(--ok);font-weight:800}
.tick li.x:before{content:"✕";color:#B23A0B}
/* modal / toast */
.mask{position:fixed;inset:0;background:rgba(22,22,22,.42);display:none;place-items:center;z-index:60;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mask.on{display:grid;animation:fade .25s var(--ease)}
.modal{background:#fff;border-radius:24px;padding:30px;width:440px;animation:rise .4s var(--ease);position:relative;max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 40px 80px -30px rgba(22,22,22,.5)}
.modal.form{width:560px;padding:30px 32px 26px}
.modal h3{font-size:20px;display:flex;align-items:center;gap:10px}
.modal>p{font-size:13.5px;color:var(--mute);margin-top:6px}
.modal .x{position:absolute;right:16px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:none;font-size:20px;color:var(--mute);display:grid;place-items:center}
.modal .x:hover{background:#F2F2EE}
.lock{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--ink);color:var(--y)}

</style></head><body>

<script src="forum-data.js"></script>
<script>
const $=s=>document.querySelector(s);let S=applyDemo(store.get());
const U=id=>USERS[id], B=id=>BOARDS.find(b=>b.id===id), P=id=>POSTS.find(p=>p.id==id), TL=id=>TOOLS.find(t=>t.id==id), TC=id=>TOOLCATS.find(c=>c.id===id);
const isAuthor=()=>S.role==='author';
const fmt=n=>Number(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={dl:'<path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5M5 19h14"/>',copy:'<rect x="8" y="8" width="11" height="11" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/>',ok:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',mail:'<rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m4.5 7 7.5 6 7.5-6"/>',lock:'<rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>',phone:'<rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/>',right:'<path d="m9 6 6 6-6 6"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/>'};
const ic=(k,st='')=>`<svg class="i" viewBox="0 0 24 24" style="${st}" aria-hidden="true">${IC[k]}</svg>`;
const av=(id,c='')=>{const u=U(id);return u.av?`<img class="av ${c}" src="${u.av}" alt="">`:`<span class="av ${c} ${id==='editor'?'ed':''}" style="background:${u.c}" aria-hidden="true">${u.mark||u.name[0]}</span>`};
const anon=(c='')=>`<span class="anon ${c}" aria-hidden="true">匿</span>`;
const uname=id=>{const u=U(id);return `<a ${id==='editor'?'':`data-go="u/${id}"`} style="font-weight:600">${u.name}</a>${u.badge?` <span class="off">${u.badge}</span>`:''}`};
const askerTxt=p=>`<span class="asker">${anon('s')}<span>匿名读者${p.asker?` · <b>${p.asker}</b>`:''}</span></span>`;
const CO=id=>COLUMNS.find(c=>c.id===id);
const colAv=(id,c='s')=>{const k=CO(id);return `<img class="av ${c}" src="img/columns/${id}.png" alt="" onerror="this.outerHTML='<span class=&quot;av ${c}&quot; style=&quot;background:${k.c}&quot;>${k.mark}</span>'">`};
const colSig=(id,c='s')=>`<a class="colsig" data-go="col/${id}">${colAv(id,c)}<span><b>${CO(id).name}</b><em>老岳AI编辑部</em></span></a>`;
const kd=k=>`<span class="kd kd-${k}">${(KINDS[k]||{name:'工具'}).name}</span>`;
const newLetters=()=>LETTERS.filter(l=>l.status==='new').length+S.asks.filter(a=>a.status==='pending').length;
const cards=k=>POSTS.filter(p=>p.type==='card'&&(!k||p.kind===k));
const go=h=>{location.hash=h};
const qs=s=>{const o={};(s||'').split('&').forEach(x=>{if(!x)return;const [k,v]=x.split('=');o[k]=decodeURIComponent(v||'')});return o};
const toQs=o=>Object.entries(o).filter(([k,v])=>v!==''&&v!=null&&!(k==='page'&&v==1)).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
function toast(t,k){const e=$('#toast');e.innerHTML=(k?ic(k,'width:16px;height:16px;color:var(--y)'):'')+'<span>'+t+'</span>';e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)}
function openM(html,cls){const b=$('#mbox');b.className='modal '+(cls||'');b.innerHTML=`<button class="x" onclick="closeM()" aria-label="关闭">×</button>`+html;$('#m').classList.add('on');window._lf=document.activeElement;setTimeout(()=>{const f=b.querySelector('input,textarea,button:not(.x)');f&&f.focus()},60)}
function closeM(){$('#m').classList.remove('on');window._lf&&window._lf.focus&&window._lf.focus()}
function save(){store.set(S);renderTop()}
function setRole(r){S.role=r;save();toast(r==='author'?'已切换为<b>作者</b>（演示）':'已切换为<b>读者</b>（演示）');if(r==='reader'&&/^#studio/.test(location.hash))go('home');else route(true)}
function renderTop(){
  const h=(location.hash||'#home').slice(1).split('/')[0];
  const map={p:'articles',c:'lib',t:'tools',q:'qa',board:'articles',col:'lib'};const cur=map[h]||h;
  const items=[['home','首页'],['articles','长文'],['prompts','提示词库'],['tools','AI 工具库'],['lib','资料库'],['qa','问答']];
  $('#nav').innerHTML=items.map(([k,t])=>`<a data-go="${k}" class="${cur===k?'on':''}" ${cur===k?'aria-current="page"':''}>${t}</a>`).join('');
  $('#usr').innerHTML=isAuthor()
    ?`<a class="btn ghost sm hide-m" data-go="studio/inbox">读者来信 <span class="num" style="background:var(--y);border-radius:5px;padding:0 5px">${newLetters()}</span></a><a class="btn y sm" data-go="studio/a">＋ 写文章</a><a data-go="studio/reward" aria-label="作者后台">${av('laoyue')}</a>`
    :`<button class="btn quiet sm hide-m" onclick="ask()">私下提问</button><a class="btn quiet sm" data-go="me">我的</a><button class="btn y sm" onclick="subscribe()">${ic('mail','width:15px;height:15px')}${S.sub?'已订阅':'订阅更新'}</button>`;
  $('#rolesw').innerHTML=`演示身份<span class="seg">${[['reader','读者'],['author','作者']].map(([k,n])=>`<a class="${S.role===k?'on':''}" onclick="setRole('${k}')">${n}</a>`).join('')}</span>`;
}
/* ---------- 提示词：变量就地填写 ---------- */
const FILL={};
const vars=p=>[...new Set((p.prompt.match(/\{\{(.+?)\}\}/g)||[]).map(x=>x.slice(2,-2)))];
function ptext(p){const f=FILL[p.id]||{};return esc(p.prompt).replace(/\{\{(.+?)\}\}/g,(m,k)=>f[k]?`<span class="var filled" role="button" tabindex="0" data-k="${esc(k)}" title="点击修改">${esc(f[k])}</span>`:`<span class="var" role="button" tabindex="0" data-k="${esc(k)}" title="点击填写">${esc(k)}</span>`)}
function pbody(p,big){const v=vars(p),f=FILL[p.id]||{},n=v.filter(k=>f[k]).length;
  return `<div class="pt" data-pid="${p.id}" style="${big?'font-size:15.5px':''}">${ptext(p)}</div>
  <div class="pfoot"><span>点<span class="var" style="padding:0 5px;cursor:default">高亮处</span>直接填写 · 已填 <span class="fc">${n}/${v.length}</span></span>${n?`<a style="text-decoration:underline" onclick="delete FILL[${p.id}];refreshP(${p.id})">清空</a>`:''}
  <button class="btn ${big?'lg y':'sm y'}" onclick="copyPrompt(${p.id},this,${!!big})">${big?`<span class="t">复制提示词</span><span class="ico">${ic('copy')}</span>`:ic('copy','width:14px;height:14px')+'<span class="t">复制</span>'}</button></div><div class="hintbox" data-hint="${p.id}"></div>`}
function refreshP(id,focusK){document.querySelectorAll(`[data-pbox="${id}"]`).forEach(b=>{b.innerHTML=pbody(P(id),b.dataset.big==='1')});if(focusK)editVar(id,focusK)}
function editVar(id,k){const el=document.querySelector(`[data-pbox="${id}"] .var[data-k="${CSS.escape(k)}"]`);if(!el)return;const long=/粘贴/.test(k);
  const inp=document.createElement(long?'textarea':'input');inp.className='vin';inp.placeholder=k;inp.value=(FILL[id]||{})[k]||'';inp.setAttribute('aria-label','填写 '+k);if(!long)inp.size=Math.max(6,k.length*2+2);
  el.replaceWith(inp);inp.focus();
  const done=(next)=>{const v=inp.value.trim();FILL[id]=FILL[id]||{};if(v)FILL[id][k]=v;else delete FILL[id][k];refreshP(id);
    if(next){const rest=vars(P(id)).filter(x=>!(FILL[id]||{})[x]);if(rest.length)editVar(id,rest[0])}};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!(long&&e.shiftKey)){e.preventDefault();inp._d=1;done(true)}if(e.key==='Escape'){inp._d=1;refreshP(id)}if(e.key==='Tab'){e.preventDefault();inp._d=1;done(true)}});
  inp.addEventListener('blur',()=>{if(!inp._d){inp._d=1;done(false)}})}
document.addEventListener('click',e=>{const v=e.target.closest('.var[data-k]');if(v){const b=v.closest('[data-pbox]');if(b)editVar(+b.dataset.pbox,v.dataset.k)}});
document.addEventListener('keydown',e=>{const v=e.target.closest&&e.target.closest('.var[data-k]');if(v&&(e.key==='Enter'||e.key===' ')){e.preventDefault();v.click()}});
function finalText(p){const f=FILL[p.id]||{};return p.prompt.replace(/\{\{(.+?)\}\}/g,(m,k)=>f[k]||'【'+k+'】')}
function copyPrompt(id,btn,big,force){const p=P(id),v=vars(p),f=FILL[id]||{},miss=v.filter(k=>!f[k]);const hb=document.querySelector(`[data-hint="${id}"]`);
  if(miss.length&&!force){document.querySelectorAll(`[data-pbox="${id}"] .var:not(.filled)`).forEach(x=>{x.classList.remove('miss');void x.offsetWidth;x.classList.add('miss')});
    hb.innerHTML=`<div class="hint" style="margin-top:10px">还有 <b>${miss.length}</b> 处没填：${miss.map(esc).join('、')}<span style="margin-left:auto;display:flex;gap:6px"><button class="btn sm ghost" onclick="editVar(${id},'${esc(miss[0])}')">先填「${esc(miss[0])}」</button><button class="btn sm" onclick="copyPrompt(${id},null,${big},true)">照样复制</button></span></div>`;return}
  try{navigator.clipboard&&navigator.clipboard.writeText(finalText(p))}catch(e){}
  if(hb)hb.innerHTML='';const b=btn||document.querySelector(`[data-pbox="${id}"] .pfoot .btn`);
  if(b){b.classList.add('done');b.querySelector('.t').textContent='已复制';const ico=b.querySelector('.ico');if(ico)ico.innerHTML=ic('ok');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');setTimeout(()=>refreshP(id),2200)}
  const n=v.length-miss.length;toast(n?`已复制完整提示词（替换了 <b>${n}</b> 处）`:'已复制提示词，未填的地方留了【】','copy')}
const pboxHTML=(p,big)=>`<div data-pbox="${p.id}" data-big="${big?1:0}">${pbody(p,big)}</div>`;
/* ---------- 列表部件 ---------- */
function item(p){
  if(p.type==='card')return `<a class="item" data-go="c/${p.id}"><div class="main"><h3>${p.title}</h3><p>${p.excerpt}</p><div class="meta">${kd(p.kind)}<span class="who">${colAv(p.col)}${CO(p.col).name}</span><span class="dot"></span><span>${B(p.board).name}</span><span class="dot"></span><span>${p.time}</span></div></div></a>`;
  const q=p.type==='question';
  const tag=q?`${p.featured?'<span class="tagq f">精选问答</span>':''}<span class="tagq q">读者来信</span>`:p.pick?`<span class="tagq p">精华</span>`:'';
  const who=q?`${askerTxt(p)}<span class="dot"></span><span>${B(p.board).name}</span><span class="dot"></span><span>${p.time}</span><span class="stack" style="margin-left:6px">${p.who.map(w=>av(w,'s')).join('')}</span><span>${p.who.map(w=>U(w).name).join('、')} 作答</span>`
    :`<span class="who">${av(p.author,'s')}${U(p.author).name}</span><span class="dot"></span><span>${B(p.board).name}</span><span class="dot"></span><span>${p.time}</span>${p.attach?`<span class="attach-mini">${ic('dl','width:13px;height:13px')}免费附件</span>`:''}`;
  return `<a class="item" data-go="${q?'q':'p'}/${p.id}"><div class="main">
    <h3>${p.top?'<span class="tagq pin">置顶</span>':''}${tag}${p.title}</h3><p>${p.excerpt}</p>
    <div class="meta">${who}<span class="sp"><span>${q?'浏览':'阅读'} <span class="num">${p.reads}</span></span><span>赞 <span class="num">${p.likes}</span></span></span></div></div>${p.cover?`<div class="thumb"><img src="${p.cover}" alt="" loading="lazy"></div>`:''}</a>`}
function cc(p){return `<a class="card cc" data-go="c/${p.id}"><div>${kd(p.kind)}</div><h3>${p.title}</h3><p>${p.excerpt}</p><div class="ft">${colAv(p.col)}<span>${CO(p.col).name}</span>${p.attach?`<span class="attach-mini">${ic('dl','width:12px;height:12px')}免费</span>`:''}<span class="r num">${p.date.slice(5)}</span></div></a>`}
function pcard(p){return `<div class="card pc"><div class="hd"><h3><a data-go="c/${p.id}">${p.title}</a></h3>${colSig(p.col)}</div><div class="sc">${(p.scenes||[]).map(s=>`<span class="chip">${s}</span>`).join('')}</div>${pboxHTML(p)}</div>`}
function tl(t){return `<a class="card tl" data-go="t/${t.id}"><span class="lg" style="background:${t.c}">${t.name[0]}</span><div><b>${t.name}</b><small>${t.one}</small></div></a>`}
function skel(n,kind){if(kind==='grid')return `<div class="cgrid" aria-busy="true">${Array.from({length:n},()=>`<div class="card cc"><div class="sk" style="height:20px;width:70px;border-radius:999px"></div><div class="sk" style="height:16px;width:90%;margin-top:14px"></div><div class="sk" style="height:12px;width:100%;margin-top:10px"></div><div class="sk" style="height:12px;width:60%;margin-top:8px"></div></div>`).join('')}</div>`;
  return `<div class="card" aria-busy="true" aria-label="加载中">${Array.from({length:n},()=>`<div class="item"><div class="main"><div class="sk" style="height:18px;width:78%"></div><div class="sk" style="height:12px;width:96%;margin-top:12px"></div><div class="sk" style="height:12px;width:60%;margin-top:8px"></div><div class="sk" style="height:10px;width:40%;margin-top:16px"></div></div><div class="sk" style="width:168px;height:112px;border-radius:10px"></div></div>`).join('')}</div>`}
function empty(i,t,s,b){return `<div class="empty"><div class="ei">${i}</div><b>${t}</b>${s}${b?`<div class="acts2">${b}</div>`:''}</div>`}
function pager(total,page,base,o){const per=20,n=Math.max(1,Math.ceil(total/per));page=Math.min(Math.max(1,+page||1),n);if(n<2)return '';
  const L=[];const add=i=>L.push(`<a class="${i===page?'on':''}" ${i===page?'aria-current="page"':''} data-go="${base}/${toQs(Object.assign({},o,{page:i}))}">${i}</a>`);
  [1,2].forEach(i=>i<=n&&add(i));if(page>4)L.push('<span class="gap">…</span>');for(let i=Math.max(3,page-1);i<=Math.min(n-2,page+1);i++)add(i);if(page<n-3)L.push('<span class="gap">…</span>');[n-1,n].forEach(i=>i>2&&add(i));
  return `<nav class="pager" aria-label="分页">${page>1?`<a class="tx" data-go="${base}/${toQs(Object.assign({},o,{page:page-1}))}">上一页</a>`:''}${L.join('')}${page<n?`<a class="tx" data-go="${base}/${toQs(Object.assign({},o,{page:page+1}))}">下一页</a>`:''}<span class="jump">跳到<input aria-label="页码" inputmode="numeric" onkeydown="if(event.key==='Enter'){go('${base}/'+toQs(Object.assign(${esc(JSON.stringify(o)).replace(/&quot;/g,"'")},{page:Math.min(${n},Math.max(1,+this.value||1))})))}">页 · 共 <span class="num">${fmt(n)}</span> 页</span></nav>`}
function sideNav(cur){return `<aside class="side" aria-label="版块"><a data-go="articles" class="${!cur?'on':''}"><i>⌂</i>全部长文</a><div class="lbl">版块</div>${BOARDS.map(b=>`<a data-go="board/${b.id}" class="${cur===b.id?'on':''}" ${cur===b.id?'aria-current="page"':''}><i>${b.icon}</i>${b.name}</a>`).join('')}</aside>`}
function subBox(){return `<div class="card subbox"><h4>订阅更新</h4><p>有新文章、精选问答时发邮件提醒你。不用注册，随时退订。</p>
  ${S.sub?`<div class="subok"><i>✓</i><span>已订阅 ${esc(S.sub)}</span><a onclick="S.sub='';save();route(true);toast('已退订')">退订</a></div>`
