<style>
/* 老岳AI产品论坛 · 微信小程序原型（首期口径 2026-11-09）
   不登录 / 无积分 / 无赞赏码、收款码、价格、外链 / 源文件提示到电脑上下载 / 核心操作=复制提示词

:root{--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:var(--sunk);min-height:100vh}
a{color:inherit;text-decoration:none;cursor:pointer}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.num{font-family:inherit;font-variant-numeric:tabular-nums;font-variant-numeric:tabular-nums}
/* 演示外壳 */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;padding:40px 24px;background:radial-gradient(circle at 70% 20%,var(--card2) 0,var(--sunk) 55%)}
.guide{width:300px}
.guide .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.guide .logo img{width:34px;height:34px;border-radius:10px;background:var(--y)}
.guide p{font-size:13px;color:var(--mute);line-height:1.7;margin:10px 0 14px}
.guide h5{font-size:12px;letter-spacing:1px;color:var(--mute);font-weight:600;margin:14px 0 4px}
.guide a{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;margin:0 -10px;border-radius:8px;font-size:13px;color:var(--ink2)}
.guide a code{font-family:Menlo,monospace;font-size:12px;color:var(--mute)}
.guide a:hover{background:var(--line3)}.guide a.on{background:var(--ink);color:var(--on-ink)}.guide a.on code{color:var(--y)}
.guide .rule{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--line3);font-size:12px;color:var(--ink2);line-height:1.7}
.phone{width:390px;height:844px;border-radius:54px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 0 0 11px #121212,0 0 0 12px #3A3A38,0 40px 80px -20px rgba(22,22,22,.45);flex:none}
body.bare{background:var(--bg)}body.bare .stage{padding:0;display:block;min-height:0;background:none}body.bare .guide{display:none}body.bare .phone{border-radius:0;box-shadow:none}
/* 系统栏 / 小程序导航栏 */
.sb{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 36px;font-size:15px;font-weight:600;z-index:20}
.sb .ic{display:flex;gap:6px;align-items:center}
.sb .bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9}.sb .bat:after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px}
.sig{display:flex;gap:2px;align-items:flex-end;height:11px}.sig i{width:3px;background:currentColor;border-radius:1px}
.navb{position:absolute;top:47px;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;z-index:20;font-size:17px;font-weight:600}
.navb .back{position:absolute;left:4px;top:0;height:44px;width:44px;display:grid;place-items:center;font-size:32px;font-weight:300;line-height:1}
.cap{position:absolute;right:7px;top:6px;width:87px;height:32px;border-radius:16px;border:1px solid rgb(var(--fg-rgb) / .12);background:color-mix(in srgb,var(--card) 70%,transparent);display:flex;align-items:center}
.cap span{flex:1;display:grid;place-items:center;height:100%;font-weight:700;letter-spacing:1px;font-size:15px}
.cap i{width:1px;height:18px;background:rgb(var(--fg-rgb) / .14)}
.cap .o{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);position:relative}.cap .o:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.topbg{position:absolute;top:0;left:0;right:0;height:91px;background:var(--bg);z-index:15}
.prog{position:absolute;top:91px;left:0;right:0;height:2px;z-index:21;pointer-events:none}.prog i{display:block;height:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
.scr{position:absolute;top:91px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.has-tab .scr{bottom:83px}.has-bar .scr{bottom:94px}
.pad{padding:4px 16px 28px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 4px 0;z-index:20}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mute);height:49px;justify-content:center;transition:transform .15s var(--ease)}
.tabbar a:active{transform:scale(.92)}
.tabbar a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--ink);font-weight:600}.tabbar a.on svg{fill:var(--y)}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);z-index:40}
.bar{position:absolute;left:0;right:0;bottom:0;height:94px;background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;align-items:flex-start;gap:4px;padding:8px 12px 0;z-index:20}
.bar .ib{width:52px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mute);gap:1px;border-radius:12px;transition:transform .15s var(--ease)}
.bar .ib:active{transform:scale(.9)}
.bar .ib b{font-size:20px;line-height:1.1;color:var(--ink);font-weight:400}
.bar .ib.on b{color:var(--y-line)}.bar .ib.on{color:var(--ink)}
.bar .main{flex:1;height:50px;border-radius:14px;background:var(--y);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),background .2s}
.bar .main:active{transform:scale(.97)}
.bar .main.ink{background:var(--ink);color:var(--on-ink)}
.bar .main.done{background:var(--okbg);color:var(--ok)}
.bar .main svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 通用 */
.av{width:28px;height:28px;border-radius:50%;flex:none;display:inline-grid;place-items:center;color:var(--on-ink);font-size:12px;font-weight:700;object-fit:cover;background:var(--y)}
.av.s{width:20px;height:20px;font-size:12px}.av.l{width:40px;height:40px;font-size:17px}.av.xl{width:56px;height:56px;font-size:20px}
.anon{width:20px;height:20px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute);background:repeating-linear-gradient(135deg,var(--sunk) 0 3px,var(--card2) 3px 6px);border:1px dashed var(--line3)}
.off{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:4px;font-size:12px;font-weight:700;background:var(--y);color:var(--on-y);vertical-align:1px}
.tg{display:inline-block;white-space:nowrap;height:18px;line-height:18px;padding:0 5px;border-radius:4px;font-size:12px;font-weight:700;margin-right:5px;vertical-align:1.5px}
.tg.jh{background:var(--dk);color:var(--y)}.tg.lx{background:var(--qbg);color:var(--q)}.tg.jx{background:var(--y);color:var(--on-y)}
.kd{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.kd:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.kd-prompt{background:var(--y2);color:var(--y-ink)}.kd-template{background:var(--qbg);color:var(--q)}.kd-term{background:var(--pbg);color:var(--p)}.kd-case{background:var(--okbg);color:var(--ok)}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line)}
.sec{display:flex;align-items:baseline;gap:8px;margin:24px 2px 10px}
.sec h4{font-size:17px}.sec small{font-size:12px;color:var(--mute)}.sec a{margin-left:auto;font-size:13px;color:var(--ink2);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--ink);color:var(--on-ink);white-space:nowrap;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.96)}
.btn.y{background:var(--y);color:var(--on-y)}.btn.gh{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.96);opacity:0;background:rgba(0,0,0,.92);color:var(--on-ink);padding:14px 18px;border-radius:14px;font-size:15px;line-height:1.55;text-align:center;max-width:280px;z-index:60;pointer-events:none;transition:opacity .18s var(--ease),transform .25s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast b{color:var(--y)}.toast .tk{display:grid;place-items:center;width:36px;height:36px;margin:0 auto 6px;border-radius:50%;background:var(--y);color:var(--on-y);font-weight:800}
.colsig{display:inline-flex;align-items:center;gap:6px;min-width:0}
.colsig span{display:flex;flex-direction:column;line-height:1.25;min-width:0}.colsig b{font-size:13px}.colsig em{font-style:normal;font-size:12px;color:var(--mute);white-space:nowrap}
/* 首页 */
.search{display:flex;align-items:center;gap:8px;height:40px;border-radius:20px;background:var(--card);border:1px solid var(--line);padding:0 14px;color:var(--mute);font-size:15px;margin-top:2px}
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.scale a{padding:12px 12px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:transform .15s var(--ease)}
.scale a:active{transform:scale(.96)}
.scale a:first-child{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.scale small{display:block;font-size:12px;color:var(--mute)}.scale a:first-child small{color:var(--deco)}
.scale b{display:block;font-family:inherit;font-variant-numeric:tabular-nums;font-size:20px;line-height:1.3;letter-spacing:-.5px}.scale a:first-child b{color:var(--y)}
.demo{font-size:12px;color:var(--mute);text-align:right;margin-top:4px}
.hero{display:block;position:relative;overflow:hidden;border-radius:18px;background:var(--ink);color:var(--on-ink);padding:18px;margin-top:14px;min-height:176px}
.hero img{position:absolute;right:-46px;top:18px;width:64%;border-radius:8px;transform:rotate(5deg);box-shadow:0 16px 30px -8px rgba(0,0,0,.6)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 45%,rgba(0,0,0,.55) 75%,rgb(var(--fg-rgb) / .15));z-index:1}
.hero>*:not(img){position:relative;z-index:2}
.hero .eb{display:inline-flex;background:var(--y);color:var(--on-y);font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
.hero h2{font-size:17px;line-height:1.42;margin-top:34px;max-width:74%}
.hero p{font-size:12px;color:var(--deco);margin-top:8px}
.it{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid var(--line2);transition:background .15s}
.it:active{background:var(--card2)}
.it:last-child{border-bottom:0}
.it .m{flex:1;min-width:0}
.it h3{font-size:15px;line-height:1.5;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .mt{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden}
.it .mt .r{margin-left:auto}
.it .th{width:92px;height:68px;border-radius:10px;overflow:hidden;flex:none;border:1px solid var(--line2);background:var(--bg)}
.it .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.list{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:0 14px}
.tg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0;transition:transform .15s var(--ease)}

.tl .lg{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--on-ink);font-weight:800;font-size:15px;flex:none}

/* Skill 库 */
.kd-skill{background:var(--okbg);color:var(--okink)}.kd-tool{background:var(--sunk);color:var(--ink2)}
.skm{display:block;padding:14px 14px 12px;margin-top:10px;transition:transform .15s var(--ease)}
.skm:active{transform:scale(.985)}
.skm .hd{display:flex;gap:10px;align-items:flex-start}
.sic{width:38px;height:38px;border-radius:11px;background:var(--dk);color:var(--y);display:grid;place-items:center;font-size:15px;flex:none}
.skm .hd div{flex:1;min-width:0}.skm .hd b{display:block;font-size:15px;line-height:1.4}

.dchip{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--mute);flex:none}

.ba>div{padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.6}
.ba em{display:flex;align-items:center;gap:5px;font-style:normal;font-size:12px;font-weight:700;margin-bottom:2px}
.ba em:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.ba .b{background:var(--bg);color:var(--mute)}.ba .b em{color:var(--mute2)}
.ba .a{background:var(--okbg);color:var(--okink)}.ba .a em{color:var(--ok)}
.skm .ba p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.skby{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line2);font-size:12px;color:var(--ink2)}
.ba.big{grid-template-columns:1fr;gap:6px;position:relative;margin-top:10px}.ba.big>div{padding:12px 14px;font-size:15px;line-height:1.75;border-radius:12px}.ba.big em{font-size:12px}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.steps3 li b{display:block;font-size:15px}.steps3 li span{display:block;font-size:13px;color:var(--mute);line-height:1.65;margin-top:2px}
.trg{display:grid;gap:8px;margin-top:10px}

.trg button:active{transform:scale(.98)}

.trg .c{margin-left:auto;font-size:12px;color:var(--mute);flex:none}

.ftree{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
