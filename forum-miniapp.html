<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>老岳AI产品论坛 · 小程序原型 | 需求与原型实践笔记</title>
<style>
/* 老岳AI产品论坛 · 微信小程序原型（首期口径 2026-11-09）
   不登录 / 无积分 / 无赞赏码、收款码、价格、外链 / 源文件提示到电脑上下载 / 核心操作=复制提示词
   11-09 改版：Tab「工具库」换成「Skill 库」；工具卡并入资料库；Skill 在手机上看效果、复制编号，电脑上下载 */
:root{--y:#FFD84D;--y2:#FFF4C2;--y3:#FFFAE3;--ink:#161616;--ink2:#2A2A28;--bg:#F4F4F1;--card:#fff;--line:#E6E6E1;--line2:#EFEFEB;--mute:#696963;--deco:#B9B9B2;--ok:#0E7350;--okbg:#E7F5EE;--q:#2F5FD0;--qbg:#EAF1FF;--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:#E7E7E1;min-height:100vh}
a{color:inherit;text-decoration:none;cursor:pointer}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

.num{font-family:"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
/* 演示外壳 */

.guide p{font-size:13px;color:var(--mute);line-height:1.7;margin:10px 0 14px}
.guide h5{font-size:11.5px;letter-spacing:1px;color:var(--mute);font-weight:600;margin:14px 0 4px}

.guide a:hover{background:#DDDDD6}.guide a.on{background:var(--ink);color:#fff}.guide a.on code{color:var(--y)}

.sb{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 36px;font-size:15px;font-weight:600;z-index:20}
.sb .ic{display:flex;gap:6px;align-items:center}

.sig{display:flex;gap:2px;align-items:flex-end;height:11px}.sig i{width:3px;background:currentColor;border-radius:1px}

.pad{padding:4px 16px 28px}

.bar .main{flex:1;height:50px;border-radius:14px;background:var(--y);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),background .2s}

/* 通用 */

.tg{display:inline-block;white-space:nowrap;height:18px;line-height:18px;padding:0 5px;border-radius:4px;font-size:10.5px;font-weight:700;margin-right:5px;vertical-align:1.5px}
.tg.jh{background:var(--ink);color:var(--y)}.tg.lx{background:var(--qbg);color:var(--q)}.tg.jx{background:var(--y);color:var(--ink)}
.kd{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap}
.kd:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.kd-prompt{background:#FFF1D6;color:#8A5300}.kd-template{background:#E9F3FF;color:#1D5BB8}.kd-term{background:#F1ECFF;color:#5B3CC4}.kd-case{background:#E7F5EE;color:#0E7350}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line)}

.btn.y{background:var(--y);color:var(--ink)}.btn.gh{background:#fff;border:1px solid var(--line);color:var(--ink)}
.toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.96);opacity:0;background:rgba(22,22,22,.92);color:#fff;padding:14px 18px;border-radius:14px;font-size:14px;line-height:1.55;text-align:center;max-width:280px;z-index:60;pointer-events:none;transition:opacity .18s var(--ease),transform .25s var(--ease)}

.scale b{display:block;font-family:"SF Mono",Menlo,monospace;font-size:19px;line-height:1.3;letter-spacing:-.5px}.scale a:first-child b{color:var(--y)}

.list{background:#fff;border-radius:16px;border:1px solid var(--line);padding:0 14px}

.kd-skill{background:#E3EFE9;color:#1F5C46}.kd-tool{background:#EDEDE8;color:var(--ink2)}

.part{margin:22px -18px 0;padding:18px 18px 4px;border-top:8px solid var(--bg)}
.ph2{display:flex;align-items:baseline;gap:8px}.ph2 .no{font:700 11px Menlo,monospace;color:var(--mute)}.ph2 h2{font-size:20px}.ph2 a{margin-left:auto;font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.part .h3:first-of-type{margin-top:12px}
.pain{font-size:15.5px;line-height:1.7;font-weight:600;padding-left:12px;border-left:3px solid var(--y);margin-top:8px}
.fitg ul{padding-left:16px}
.chat{display:grid;gap:10px;margin-top:10px;padding:12px;border-radius:14px;background:#F4F4F1}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.you{margin-left:auto;flex-direction:row-reverse}
.msg .mav{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.msg.you .mav{background:var(--ink);color:#fff}.msg.ai .mav{background:var(--y)}
.msg small{display:block;font-size:10.5px;color:var(--mute);margin:0 4px 2px}.msg.you small{text-align:right}
.msg .bub{padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.7}
.msg.you .bub{background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.ai .bub{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.dv .bub{background:var(--okbg);border-color:#BFE3D2}.msg.dv small{color:var(--ok);font-weight:700}
.faq{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.faq details+details{border-top:1px solid var(--line2)}
.faq summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:48px;padding:10px 12px;font-size:14px;font-weight:600}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";margin-left:auto;color:var(--mute);font-size:18px}.faq details[open] summary:after{content:"−"}
.faq p{padding:0 12px 12px;font-size:13.5px;line-height:1.75;color:var(--ink2)}
.ait{display:flex;gap:6px;overflow-x:auto;margin:10px -18px 8px;padding:0 18px;scrollbar-width:none}.ait::-webkit-scrollbar{display:none}
.ait button{flex:none;height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.ait button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cmdbox{border-radius:12px;overflow:hidden;background:#1B1B19;color:#E4E4DE}
.cmdh{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid #2E2E2B}
.oss{display:inline-flex;background:#2A2A27;border-radius:16px;padding:2px}.oss a{padding:5px 10px;border-radius:14px;font-size:11.5px;color:#A9A9A2}.oss a.on{background:#fff;color:var(--ink);font-weight:600}
.cmdh .btn{margin-left:auto;height:32px;font-size:12.5px}
.cmdbox pre{margin:0;padding:12px;font:11.5px/1.8 Menlo,monospace;white-space:pre-wrap;word-break:break-all}
.cmdnote{padding:0 12px 10px;font-size:11.5px;color:#9C9C95;line-height:1.6}
.verify{margin-top:8px;padding:9px 12px;border-radius:10px;background:var(--okbg);color:#164A36;font-size:12.5px;line-height:1.65}
.verify code{font-family:Menlo,monospace;background:#fff;border-radius:4px;padding:0 4px}
.webi{padding:12px;border-radius:12px;border:1px solid var(--line);background:#FBFBF9;font-size:13.5px;line-height:1.7}.webi ul{padding-left:16px;color:var(--mute);margin:6px 0 10px;font-size:12.5px}.webi .btn{width:100%;height:44px;border-radius:12px}
/* 吸顶搜索 + 工具条 */
.stb{position:sticky;top:0;z-index:8;background:var(--bg);margin:0 -16px;padding:6px 16px 8px;box-shadow:0 1px 0 rgba(22,22,22,.04)}
.sbox{display:flex;align-items:center;gap:8px;height:42px;border-radius:21px;background:#fff;border:1px solid var(--line);padding:0 6px 0 14px;transition:border-color .2s,box-shadow .2s}
.sbox:focus-within{border-color:var(--ink);box-shadow:0 0 0 4px rgba(255,216,77,.35)}
.sbox svg{width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:1.8;flex:none}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;color:var(--ink)}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox .clr{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--mute)}
.sbox .clr:active{background:#F2F2EE}.sbox .clr[hidden]{display:none}
.sline{display:flex;align-items:center;gap:8px;margin-top:8px;min-height:24px}
.cnt2{font-size:12px;color:var(--mute)}.cnt2 b{color:var(--ink);font-family:Menlo,monospace}.cnt2 a{text-decoration:underline;color:var(--ink2);margin-left:4px}
.seg2{margin-left:auto;display:inline-flex;background:#E9E9E4;border-radius:14px;padding:2px}
.seg2 a{padding:3px 10px;border-radius:12px;font-size:12px;color:var(--mute);min-height:24px;display:inline-flex;align-items:center}
.seg2 a.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(22,22,22,.08)}
mark{background:var(--y);color:var(--ink);border-radius:3px;padding:0 1px}
.sgrp{margin-top:14px}.sgrp h5{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--mute);margin:0 2px 6px;font-weight:600}
.sjump{display:flex;gap:8px;flex-wrap:wrap}
.sjump a{height:34px;padding:0 13px;border-radius:17px;background:#fff;border:1px solid var(--line);font-size:13px;display:inline-flex;align-items:center;gap:4px}
.sjump a:active{transform:scale(.96)}
.shd{display:flex;align-items:center;margin:16px 2px 8px}.shd h4{font-size:14px}.shd a{margin-left:auto;font-size:12px;color:var(--mute);text-decoration:underline}
.errbox .btn{margin-top:14px}
/* 真实内容 */
.newtag{display:inline-flex;align-items:center;height:17px;padding:0 5px;border-radius:4px;background:var(--y2);color:#7A5B00;font-size:10.5px;font-weight:700}
.md{font-size:14.5px;line-height:1.8;color:var(--ink2);overflow-wrap:anywhere}.md p{margin:6px 0}.md ul,.md ol{padding-left:20px;margin:6px 0}
.md h2,.md h3,.md h4{font-size:15px;color:var(--ink);margin:14px 0 4px}
.md code,.prose code{font-family:Menlo,monospace;font-size:.86em;background:#F2F2EE;border-radius:4px;padding:0 4px}
.md blockquote,.prose blockquote{border-left:3px solid var(--y);background:#FBFBF7;padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0}
.mdtbl{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.mdtbl table{border-collapse:collapse;font-size:12.5px;line-height:1.6;min-width:100%}
.mdtbl th,.mdtbl td{padding:7px 10px;border-top:1px solid var(--line2);text-align:left;vertical-align:top;min-width:88px}
.mdtbl tr:first-child th{border-top:0;background:#FBFBF9;color:var(--mute);white-space:nowrap}
.mdcode{position:relative;margin:8px 0;border-radius:10px;background:#1B1B19;overflow:hidden}
.mdcode pre{margin:0;padding:12px;color:#E8E8E2;font:11.5px/1.75 Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto}
.mdcode .mdcp{position:absolute;right:6px;top:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--y);font-size:11.5px;font-weight:700}
.csec{margin-top:18px}.csec>h3{font-size:15px;display:flex;align-items:center;gap:6px}.csec>h3:before{content:"";width:3px;height:14px;border-radius:2px;background:var(--y)}
.srcs{margin-top:14px;padding:10px 12px;border-radius:10px;background:#F7F7F3;font-size:11.5px;color:var(--mute);line-height:1.65}
.hero.noimg:before{background:radial-gradient(circle at 85% 15%,rgba(255,216,77,.3),transparent 50%),var(--ink)}.hero .bigq{position:absolute;right:16px;top:-8px;font:800 110px/1 Georgia,serif;color:rgba(255,216,77,.18);z-index:1}
.hero.noimg h2{max-width:100%;margin-top:28px}
.upline{font-size:11.5px;color:var(--mute);margin-top:6px;line-height:1.55}.upline b{color:var(--ink2);font-weight:600}
.it h3,.pc h3,.skm .hd b,.dt h1{overflow-wrap:anywhere}
/* 胶囊（多选） */
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;background:#fff;border:1px solid var(--line);font-size:13px;display:flex;align-items:center;gap:5px;color:var(--ink2);transition:transform .15s var(--ease),background .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip.on:before{content:"✓";color:var(--y);font-weight:800}
.chip small{font-family:Menlo,monospace;font-size:10.5px;color:var(--mute)}.chip.on small{color:#B5B5AE}
.selbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin:10px 2px 0}
.selbar a{text-decoration:underline;color:var(--ink2)}
/* 提示词卡 */
.pc{padding:14px 14px 12px;margin-top:10px;display:block;transition:transform .15s var(--ease)}
.pc:active{transform:scale(.985)}
.pc h3{font-size:15.5px;line-height:1.5}
.pc .pv{font-size:13px;line-height:1.85;color:var(--ink2);margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.pc .ft{display:flex;align-items:center;gap:8px;margin-top:10px}
.pc .ft .btn{margin-left:auto;height:32px;font-size:12.5px}
.var{display:inline;padding:1px 6px;margin:0 1px;border-radius:6px;background:var(--y2);color:#6B4E00;font-weight:600;border:1px dashed #E5C24A;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.var.filled{background:var(--okbg);color:var(--ok);border:1px solid #BFE3D2}
.var.miss{border:1px solid #D9480F;animation:nudge .5s var(--ease)}
@keyframes nudge{30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
.more-ld{padding:14px 0;text-align:center;font-size:12.5px;color:var(--mute)}
/* 详情 */
.dt{padding:8px 18px 28px;background:#fff;min-height:100%}
.dt .crumb{font-size:12px;color:var(--mute);margin-bottom:8px}
.dt h1{font-size:21px;line-height:1.42;letter-spacing:-.2px;margin-top:8px}
.dt .sum{font-size:14.5px;color:var(--ink2);line-height:1.75;margin-top:6px}
.fitline{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--y3);border:1px solid #F3E3A6;font-size:13.5px;line-height:1.65}
.fitline b{flex:none;font-size:11px;height:20px;padding:0 7px;border-radius:5px;background:var(--ink);color:var(--y);display:inline-flex;align-items:center;margin-top:1px}
.pbox{margin-top:14px;border-radius:14px;background:#FBFBF7;border:1px solid var(--line);overflow:hidden}
.pbox .ph{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line2);font-size:11.5px;color:var(--mute)}
.pbox .pt{padding:12px 14px 14px;font-size:15px;line-height:2;white-space:pre-wrap;word-break:break-word}
.pbox .pt .var{cursor:pointer;padding:3px 8px}
.by{display:flex;align-items:center;gap:10px;margin:14px 0 16px;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.by .n{font-size:14px;font-weight:600}.by small{display:block;font-size:11.5px;color:var(--mute);font-weight:400}
.prose{font-size:16px;line-height:1.85;color:#262624}
.prose h2{font-size:17.5px;margin:22px 0 6px;line-height:1.5}
.prose p{margin:10px 0}
.prose img{width:100%;border-radius:10px;border:1px solid var(--line);margin:12px 0;display:block}
.prose blockquote{border-left:3px solid var(--y);background:#FBFBF7;padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14.5px}
.pcdl{margin:16px 0 4px;border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(160deg,#FBFBF7,#fff)}
.pcdl .hd{display:flex;gap:12px;align-items:center}
.pcdl .hd div{flex:1;min-width:0}
.pcdl b{font-size:14px;display:block;line-height:1.45;word-break:break-all}
.pcdl small{font-size:11.5px;color:var(--mute)}
.fbadge{width:42px;height:50px;border-radius:8px;background:var(--ink);color:var(--y);display:grid;place-items:center;font-size:10.5px;font-weight:700;font-family:Menlo,monospace;flex:none}
.pcdl .how{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--y2);font-size:12.5px;color:#5C4600;line-height:1.65}
.pcdl .how svg{flex:none;width:20px;height:20px;stroke:#5C4600;fill:none;stroke-width:1.7;margin-top:1px}
.code{display:inline-flex;align-items:center;gap:6px;font-family:Menlo,monospace;font-weight:700;background:#fff;border:1px dashed #D9B84A;border-radius:6px;padding:0 6px;color:var(--ink)}
.inc{margin-top:10px;list-style:none}
.inc li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2);font-size:13px}
.inc code{font-family:Menlo,monospace;font-size:11.5px;background:#F2F2EE;border-radius:5px;padding:1px 6px}
.defbox{padding:14px;border-radius:12px;background:#F7F5FF;border:1px solid #E4DCFF;font-size:15px;line-height:1.8;margin-top:14px}
.defbox+.defbox{margin-top:8px;background:#FBFBF9;border-color:var(--line2);font-size:14px}
.defbox b{display:block;font-size:11px;color:#5B3CC4;margin-bottom:2px}.defbox+.defbox b{color:var(--mute)}
.pts{list-style:none;display:grid;gap:8px;margin-top:14px;counter-reset:c}
.pts li{counter-increment:c;display:flex;gap:10px;padding:11px 12px;border-radius:12px;background:#FBFBF9;border:1px solid var(--line2);font-size:14.5px;line-height:1.65}
.pts li:before{content:counter(c);flex:none;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-family:Menlo,monospace;font-weight:800;font-size:11px;display:grid;place-items:center;margin-top:1px}
.steps3{list-style:none;display:grid;gap:8px;margin-top:10px;counter-reset:c}
.steps3 li{counter-increment:c;display:flex;gap:10px;padding:11px 12px;border-radius:12px;background:#FBFBF9;border:1px solid var(--line2);font-size:14.5px;line-height:1.65}
.steps3 li:before{content:counter(c);flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--y);font-family:Menlo,monospace;font-weight:800;font-size:11px;display:grid;place-items:center;margin-top:1px}
.fitg{display:grid;gap:8px;margin-top:12px}.fitg div{padding:11px 12px;border-radius:12px;font-size:14px;line-height:1.7}.fitg .yes{background:var(--okbg)}.fitg .no{background:#FBEFEA}
.fitg b{display:block;font-size:11.5px}.fitg .yes b{color:var(--ok)}.fitg .no b{color:#B23A0B}
.h3{font-size:15px;margin:20px 0 0}
.credit{margin-top:18px;padding:10px 12px;border-radius:10px;background:#F7F7F3;font-size:11.5px;color:var(--mute);line-height:1.6}
.addn{margin:22px -18px 0;padding:16px 18px 2px;border-top:8px solid var(--bg)}
.addn h3{font-size:16px;display:flex;align-items:baseline;gap:8px}.addn h3 small{font-size:11.5px;color:var(--mute);font-weight:400}
.adi{padding:12px 0;border-bottom:1px solid var(--line2)}.adi:last-child{border:0}
.adi .q{font-size:13px;color:var(--mute);padding-left:10px;border-left:3px solid var(--line);line-height:1.6}
.adi .a{font-size:14.5px;line-height:1.8;margin-top:6px}
.adi .a b{display:inline-flex;align-items:center;height:17px;padding:0 5px;border-radius:4px;background:var(--ink);color:var(--y);font-size:10.5px;margin-right:6px;vertical-align:1.5px}
.more{margin:0 -18px;padding:16px 18px;border-top:8px solid var(--bg)}
.more h3{font-size:16px;margin-bottom:2px}
.ans{padding:16px 0;border-top:1px solid var(--line2)}
.ans .h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.ans .h small{display:block;font-size:11px;color:var(--mute);font-weight:400}
.ans .h .by2{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--ink);color:var(--y)}
.ans p{font-size:15px;line-height:1.85;margin-top:10px}
.ans .ops{display:flex;gap:10px;margin-top:10px}
.asker{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-top:12px}.asker b{color:var(--ink2);font-weight:600}
/* 问答头 */
.qhd{padding:16px;border-radius:16px;background:var(--ink);color:#fff;position:relative;overflow:hidden}
.qhd:after{content:"?";position:absolute;right:14px;top:-18px;font-size:110px;font-weight:800;color:#262623;line-height:1}
.qhd>*{position:relative;z-index:1}
.qhd h2{font-size:18px}.qhd p{font-size:12.5px;color:#B5B5AE;margin-top:4px}
.steps{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:12px}
.steps span{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 4px;border-radius:13px;background:#2A2A27;white-space:nowrap}
.steps i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--y);color:var(--ink);font-size:11px;font-weight:800;display:grid;place-items:center;font-family:Menlo,monospace}
.steps em{font-style:normal;color:#77776F}
.qit{display:block;padding:15px 0;border-bottom:1px solid var(--line2)}.qit:last-child{border-bottom:0}
.qit h3{font-size:15.5px;line-height:1.5;font-weight:650}
.qit .ex{font-size:13px;color:var(--mute);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.6}
.qit .mt{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;color:var(--mute)}
.stack{display:flex}.stack .av{margin-left:-5px;border:1.5px solid #fff}.stack .av:first-child{margin-left:0}
.fab{position:absolute;left:16px;right:16px;bottom:95px;height:50px;border-radius:14px;background:var(--y);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15.5px;z-index:19;box-shadow:0 10px 24px -8px rgba(22,22,22,.35);transition:transform .15s var(--ease)}
.fab:active{transform:scale(.97)}
.fab small{font-weight:500;font-size:11.5px;color:#6B5600}
/* 我的 */
.mehd{background:var(--ink);color:#fff;padding:14px 18px 22px;margin-top:-1px}
.mehd .who{display:flex;align-items:center;gap:12px}.mehd .who b{font-size:19px}.mehd .who small{display:block;font-size:12px;color:#B5B5AE;margin-top:2px}
.local{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:#ECECE7;font-size:12px;color:var(--ink2);line-height:1.6;display:flex;gap:8px}
.local i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--y);display:grid;place-items:center;font-style:normal;font-size:10px;margin-top:1px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 16px 0;padding:14px 4px}
.grid3 a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute)}
.grid3 b{font-family:Menlo,monospace;font-size:21px;color:var(--ink)}
.rows{margin:12px 16px 0;padding:0 14px}
.rows a{display:flex;align-items:center;gap:12px;height:54px;border-bottom:1px solid var(--line2);font-size:15px}
.rows a:last-child{border:0}
.rows a .ri{width:30px;height:30px;border-radius:9px;background:#F2F2EE;display:grid;place-items:center;flex:none}
.rows a .ri svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rows a .ri.y{background:var(--y)}
.rows a small{margin-left:auto;font-size:12.5px;color:var(--mute)}
.rows a:after{content:"›";color:var(--mute);font-size:20px;margin-left:4px}
/* 表单 */
.form{padding:4px 16px 24px}
.pvs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 18px}
.pvs div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11px;color:var(--mute);line-height:1.5}
.pvs b{display:block;font-size:12.5px;color:var(--ink);margin-bottom:2px}
